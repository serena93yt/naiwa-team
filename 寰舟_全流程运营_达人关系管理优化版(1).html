globalThis.MarketPolicy=(()=>{
 const removed=/印尼|印度尼西亚|indones(?:ia|ian)|jakarta|🇮🇩|\bIDR\b/i;
 const fieldNames=new Set(['region','country','countryCode','market','marketCode']);
 function allowed(r){return TK_REGIONS.includes(r)||r==='ALL'}
 function clean(value){
   if(typeof value==='string')return removed.test(value)?undefined:value;
   if(Array.isArray(value))return value.map(clean).filter(v=>v!==undefined);
   if(!value||typeof value!=='object')return value;
   if(Object.entries(value).some(([k,v])=>fieldNames.has(k)&&typeof v==='string'&&!allowed(v)))return undefined;
   if(value.language==='id'||value.locale==='id_ID'||value.locale==='id')return undefined;
   const out={};for(const [k,v] of Object.entries(value)){if(k==='ID'||k==='IDR'||k==='id_ID')continue;const next=clean(v);if(next!==undefined)out[k]=next}
   if(Array.isArray(out.selectedMarkets))out.selectedMarkets=out.selectedMarkets.filter(r=>TK_REGIONS.includes(r));
   return out;
 }
 function migrate(s){
   const initial=JSON.stringify(s),next=clean(s)||{};
   const oldProject=s.project;
   if(oldProject&&(!TK_REGIONS.includes(oldProject.channels?.tiktok?.region)||!next.project?.name||!next.project?.channels?.tiktok))next.project=null;

/* Pure completion rules shared by the UI and tests. Nothing is completed by visiting a page. */
globalThis.computeWorkflowProgress=function({state,project=state.project,targets=[],jobs=state.jobs||[],dirtyRegions=[],uncheckedJobs=[]}){
 const regions=[...new Set(targets.map(t=>typeof t==='string'?t:t.region))].filter(r=>TK_REGIONS.includes(r)),count=regions.length;
 const stores=(state.stores||[]).filter(s=>s.status==='connected'&&regions.includes(s.region));
 const latest=regions.map(r=>jobs.findLast(j=>j.projectId===project?.id&&j.productRevision===project?.revision&&j.region===r&&!j.stale));
 const generated=j=>j&&['awaiting_review','succeeded'].includes(j.status)&&['copy','script','live','compliance'].every(k=>j.outputs?.some(o=>o.kind===k&&o.text?.trim()));
 const reviewed=j=>generated(j)&&j.origin==='manual'&&!dirtyRegions.includes(j.region)&&!uncheckedJobs.includes(j.id)&&(state.reviews||[]).some(r=>r.jobId===j.id&&r.productRevision===project?.revision&&r.confirmed);
 const released=j=>reviewed(j)&&stores.some(s=>s.region===j.region&&(state.releases||[]).some(r=>r.storeId===s.id&&r.jobId===j.id));
 const service=stores.filter(s=>(state.conversations||[]).some(c=>c.storeId===s.id&&c.productId===project?.id&&c.processedAt&&(c.status==='resolved'||c.messages?.some(m=>m.automatic))));
 const knowledge=stores.filter(s=>(state.knowledge||[]).some(k=>k.storeId===s.id&&k.status==='approved'&&k.reviewedAt&&k.productId===project?.id));
 const stats=(state.analyticsRuns||[]).filter(r=>r.projectId===project?.id&&r.productRevision===project?.revision&&r.releaseIds?.some(id=>(state.releases||[]).some(p=>p.id===id&&latest.some(j=>j?.id===p.jobId))));
 const values=[
 ['connect','店铺接入',new Set(stores.map(s=>s.region)).size,count,'所选国家均有已连接店铺'],
 ['project','商品建档',project?.id&&project.id===state.project?.id&&project.revision===state.project?.revision&&['name','spec','benefits'].every(k=>project[k]?.trim())?1:0,1,'商品名称、规格和卖点已保存'],
 ['content','内容生成',latest.filter(generated).length,count,'所选国家的文案、脚本、直播与核查说明已返回'],
 ['compliance','精修核查',latest.filter(reviewed).length,count,'逐国保存精修，评分核查完成且无未保存修改'],
 ['publish','店铺发布',latest.filter(released).length,count,'当前版本已发布到对应国家的模拟店铺'],
 ['service','客服处理',new Set(service.map(s=>s.region)).size,count,'已实际处理当前商品咨询；仅开启策略不算完成'],
 ['knowledge','知识沉淀',new Set(knowledge.map(s=>s.region)).size,count,'当前商品的新增或整理知识已人工审核入库'],
 ['roi','经营复盘',new Set(stats.flatMap(r=>r.regions||[]).filter(r=>regions.includes(r))).size,count,'当前版本发布后，实际同步对应国家经营样本']
 ];
 return values.map(([route,label,completed,total,description])=>({route,label,completed:Math.min(completed,total),total,description,status:total>0&&completed>=total?'done':completed>0?'partial':'pending'}));
};

    return `<div class="kb-category"><div class="kb-category-head"><b>${escape(c.name)}</b><small>${escape(c.desc||'')}</small><button class="quiet-btn kb-add" data-add-category="${escape(c.id)}">＋ 添加知识</button></div>${list.length?list.map(k=>`
     <div class="knowledge-row"><div><h3>${escape(k.title)}</h3><small class="knowledge-store-tag">${escape(storeLabel(k.storeId))}${k.platform?' · '+escape(k.platform):''}</small><p>${escape(k.content)}</p><small>${escape(statusLabel(k.status))}${k.synthetic?' · 合成问答 · 待核验事实':''}</small>${k.source?`<small class="knowledge-provenance">来源：${escape(k.source)}</small>`:''}</div><div class="knowledge-row-actions"><button class="quiet-btn" data-edit-knowledge="${escape(k.id)}">编辑知识</button>${k.status==='pending'?`<button data-id="${escape(k.id)}" data-review="approved">审核入库</button><button class="reject" data-id="${escape(k.id)}" data-review="rejected">退回</button>`:k.status==='approved'?`<button data-use-knowledge="${escape(k.id)}" ${project.faq.some(f=>f.knowledgeId===k.id)?'disabled':''}>${project.faq.some(f=>f.knowledgeId===k.id)?'已加入商品 FAQ':'用于商品介绍 / FAQ'}</button>`:''}</div></div>`).join(''):'<p class="kb-empty">暂无知识，点「＋ 添加知识」或从客户问题整理。</p>'}</div>`;
   }).join('')}</section>`;
  }).join('')||'<p class="modal-sub">知识库框架加载失败。</p>';
  $$('[data-edit-knowledge]').forEach(b=>on(b,()=>{const k=items.find(k=>k.id===b.dataset.editKnowledge);modal('编辑知识 · 保存后重新审核',`<label class="modal-field">标题<input id="edit-knowledge-title" value="${escape(k.title)}"></label><label class="modal-field">内容<textarea id="edit-knowledge-content" rows="6">${escape(k.content)}</textarea></label><p class="modal-sub">保存后回到待审核状态，已引用商品 FAQ 将标记失效，需重新核验。</p><button class="primary" id="save-knowledge-edit">保存修改</button>`);$('#save-knowledge-edit').onclick=()=>safe(async()=>{const button=$('#save-knowledge-edit');button.disabled=true;try{await API.editKnowledge(k.id,{title:$('#edit-knowledge-title').value,content:$('#edit-knowledge-content').value});applyState(await API.bootstrap());$('#dialog').close();go('knowledge');toast('已保存，请重新审核知识')}finally{if(button.isConnected)button.disabled=false}})}));
  $$('[data-review]').forEach(b=>on(b,()=>safe(async()=>{b.disabled=true;try{await API.review(b.dataset.id,b.dataset.review);go('knowledge')}catch(e){b.disabled=false;throw e}})));
  $$('[data-use-knowledge]').forEach(b=>on(b,()=>safe(()=>useKnowledge(items.find(k=>k.id===b.dataset.useKnowledge)))));
  $$('[data-add-category]').forEach(b=>on(b,()=>knowledgeCapture(null,b.dataset.addCategory)));
  $$('[data-jump]').forEach(b=>on(b,()=>{const el=document.getElementById(b.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}));
 }catch(e){if(version===renderVersion)$('#knowledge-list').innerHTML=`<div class="error-box">无法加载知识：${escape(e.message)}</div>`}
}
window.addEventListener('keydown',e=>{if(e.key==='Escape')$('.app')?.classList.remove('menu-open')});
function applyState(state){if(state.project){project=state.project;project.assets||=[];project.faq||=[]}tasks={};targetTasks={};for(const j of state.jobs||[]){if(j.projectId!==project.id)continue;const k=j.platform+':'+j.region+':'+j.language;targetTasks[k]={...j,stale:j.productRevision!==project.revision};if(j.region===project.channels.tiktok.region)tasks[j.platform]=targetTasks[k]}persist();}
const Flow=createWorkflowUI({applyState,$, $$, escape, API, go, toast, modal, safe, project:()=>project, tasks:()=>tasks, allTasks:()=>Object.values(targetTasks), selectConversation:id=>selected=id, resetCustomerFilter:storeId=>{customerPlatform='all';customerStore=storeId||'all';filter='all';search=''}, setTask:(key,job)=>{tasks[key]=job;targetTasks[key+':'+job.region+':'+job.language]=job;updateTasks()}, route:()=>route, version:()=>renderVersion, render, market, langs, setCustomerPlatform:k=>{customerPlatform=k;renderPeople()}, customerPlatform:()=>customerPlatform, customerStore:()=>customerStore,setCustomerStore:id=>{customerStore=id;renderPeople()},refreshCustomerView:renderPeople, modify, persist, generateOne, isGenerating:()=>busy.size>0, upload, channelSettings, showResult, settings});
function showLogin(message=''){
 document.body.className='v2 login-view';$('#dialog').close();$('#dialogContent').innerHTML='';
 $('#root').innerHTML=`<main class="merchant-login"><div class="login-story"><div class="eyebrow">寰舟 · MERCHANT WORKSPACE</div><h1>你的生意，<br>你的专属知识。</h1><p>商品、客户问答与经营资料，<br>在自己的商家空间里形成闭环。</p><div class="login-points"><span>独立知识库</span><span>会话与数据隔离</span><span>审核后引用</span></div><small>${document.querySelector('meta[name="hz-public-demo"]')?'公网演示 · 请仅使用合成数据':'本地服务演示 · 不连接真实 TikTok'}</small></div><section class="login-form-panel"><h2>进入商家工作空间</h2><p>每个商家使用自己的账号；新商家的资料库为空。</p><form id="merchant-login-form"><label>商家名称<input id="merchant-name" autocomplete="username" required minlength="2" maxlength="60" placeholder="输入自己的商家名称"></label><label>登录密码<input id="merchant-password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" placeholder="至少 8 位"></label><div class="login-actions"><button type="submit" class="primary" id="merchant-login">登录</button><button type="button" class="secondary" id="merchant-register">创建独立商家账号</button></div><p id="merchant-auth-status" role="status">${escape(message)}</p></form><small>密码经加盐哈希保存；店铺数据由服务端按登录商家隔离。当前为功能演示，非生产经营系统。请勿录入真实客户隐私、支付资料或平台密钥。</small></section></main>`;
 const submit=async register=>{const name=$('#merchant-name').value.trim(),password=$('#merchant-password').value;if(name.length<2||password.length<8){$('#merchant-auth-status').textContent='商家名称至少 2 字，密码至少 8 位';return}$$('.login-actions button').forEach(b=>b.disabled=true);$('#merchant-auth-status').textContent=register?'正在创建独立工作空间…':'正在验证商家身份…';try{await API.login(name,password,register);$('#merchant-password').value='';authChannel?.postMessage('changed');await boot()}catch(e){$('#merchant-auth-status').textContent=e.message;$$('.login-actions button').forEach(b=>b.disabled=false)}};
 $('#merchant-login-form').onsubmit=e=>{e.preventDefault();submit(false)};$('#merchant-register').onclick=()=>submit(true);
}
const authChannel=typeof BroadcastChannel==='function'&&API.isRemote()?new BroadcastChannel('huanzhou-auth'):null;
if(authChannel)authChannel.onmessage=()=>{Flow.reset();boot()};
window.addEventListener('hz-session-expired',()=>{Flow.reset();showLogin('会话已过期，请重新登录')});
window.addEventListener('hz-storage-error',e=>toast(e.detail));
async function boot(){
 $('#root').innerHTML='<div class="boot-state"><h1>寰舟</h1><p>正在确认商家身份并恢复工作空间…</p></div>';
 try{const auth=await API.session();if(!auth.authenticated){showLogin();return}project=structuredClone(defaultProject);const state=await API.bootstrap();applyState(state);Flow.hydrate(state);route=state.stores.some(s=>s.status==='connected')?'project':'connect';render()}
 catch(e){$('#root').innerHTML=`<div class="boot-state"><h1>连接暂不可用</h1><p>${escape(e.message)}</p><button id="retry-boot">重新连接</button></div>`;$('#retry-boot').onclick=boot}
}
boot();
})();
